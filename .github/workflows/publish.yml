name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build and Publish
        uses: banshee-lab/docker-deploy-action@main
        with:
          username: dahool
          password: ${{ secrets.GH_TOKEN }}
